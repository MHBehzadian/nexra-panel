<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#080e18" />
    <meta name="theme-color" content="#f8f9fb" media="(prefers-color-scheme: light)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="nexra panel" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexra Panel</title>
    <script>
        // Applied here rather than in React: useTheme only mounts inside the
        // sidebar, so the login page rendered light for everyone regardless of
        // their saved choice. Running before paint also kills the flash of the
        // wrong theme on every load.
        (function () {
            try {
                // The login page is light only, so it never takes the class.
                if (/\/login\/?$/.test(location.pathname)) return;
                // During the Black Friday festival the panel is black by
                // default, and the choice is kept apart from the usual one
                // (see src/hooks/useTheme.ts).
                var fest = JSON.parse(localStorage.getItem('nx-festival') || 'null');
                var live = !!(fest && fest.active &&
                    (!fest.ends_at || !(Date.parse(fest.ends_at) <= Date.now())));
                var saved = localStorage.getItem(live ? 'nx-festival-theme' : 'theme');
                var dark = saved
                    ? saved === 'dark'
                    : live || window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (live) document.documentElement.classList.add('festival');
                if (dark) document.documentElement.classList.add('dark');
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
