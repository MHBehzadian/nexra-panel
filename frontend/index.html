<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0e0f1c" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="nexra panel" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexra Panel</title>
    <script>
        // Applied here rather than in React: useTheme only mounts inside the
        // sidebar, so the login page rendered light for everyone regardless of
        // their saved choice. Running before paint also kills the flash of the
        // wrong theme on every load.
        (function () {
            try {
                // The login page is dark only (the theme's cover), and dark is
                // the default until someone picks light from the sidebar.
                var login = /\/login\/?$/.test(location.pathname);
                var saved = localStorage.getItem('theme');
                if (login || saved !== 'light') document.documentElement.classList.add('dark');
            } catch (e) { }
        })();
    </script>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
</body>

</html>
